name: Implementation checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -c constraints-tested.txt
          python -m pip install -e . --no-deps
      - name: Unit and invariant tests
        run: python -m pytest -q
      - name: Tiny complete pipeline
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m pmd run --config configs/tiny.yaml --run-dir runs/ci --device cpu --threads 2
          python scripts/validate_run.py --run-dir runs/ci
          python scripts/inspect_pair.py --run-dir runs/ci --device cpu
          python -m pmd run --config configs/tiny.yaml --run-dir runs/ci --device cpu --threads 2 --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-check-logs
          path: |
            runs/ci/reports/
            runs/ci/manifest.json
            runs/ci/seed_17/reports/
            runs/ci/seed_17/teacher/training_summary.json
